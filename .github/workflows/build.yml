name: GIGA DASH BOT — Windows Build

on:
  push:
    branches: ["main"]
    paths:
      - "GeoPilot/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build GIGA Dash Bot for GD 2.2081
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build Geode mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: v5.11.2
          path: GeoPilot
          target: Win64
          use-lto: false

      - name: Upload .geode artifact
        uses: actions/upload-artifact@v4
        with:
          name: GIGA-DASH-BOT-Windows-GD-2.2081
          path: ${{ steps.build.outputs.build-output }}/*.geode
          if-no-files-found: error
          retention-days: 30
