name: GeoPilot Multi-Platform Build

on:
  workflow_dispatch:
  push:
    branches: ["**"]

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: Win64
            os: windows-latest
          - target: MacOS
            os: macos-latest
          - target: iOS
            os: macos-latest
          - target: Android32
            os: ubuntu-latest
          - target: Android64
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build for Geode v5.10.1
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: v5.10.1
          target: ${{ matrix.target }}
          combine: true

  package:
    name: Combine universal package
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Combine .geode outputs
        uses: geode-sdk/build-geode-mod/combine@main
        id: combine
      - name: Upload .geode artifact
        uses: actions/upload-artifact@v4
        with:
          name: GeoPilot-Geode-v5.10.1-GD-2.2081
          path: ${{ steps.combine.outputs.build-output }}
          if-no-files-found: error
          retention-days: 30
